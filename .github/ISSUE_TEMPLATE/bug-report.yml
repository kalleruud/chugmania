name: Bug report
description: Something in Chugmania does not work the way it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Give the issue a title that says what goes wrong and where, for example "Lap time disappears after editing it on the session page".
        Your description is enough. Screenshots help but are optional, and you do not need to know the cause. If you are unsure of something, write "Unknown".
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe what you were doing, what went wrong, and how it affected you or others. Include any error message you saw.
      placeholder: I edited my lap time on tonight's session. After saving, the time disappeared from the leaderboard, so I could not see my placing.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: How can someone else make it happen? If it only happens sometimes, say so and describe when you have seen it.
      placeholder: |
        1. Open a session with lap times
        2. Edit one of your lap times and save
        3. The time is no longer shown on the leaderboard
    validations:
      required: true
  - type: textarea
    id: expected-result
    attributes:
      label: What did you expect to happen?
      placeholder: The edited time should replace the old one on the leaderboard.
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: Page or link
      description: Where in the app it happened. A link to the page is ideal.
      placeholder: https://chugmania.no/sessions/...
    validations:
      required: false
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: iPhone 15, Safari / Windows laptop, Chrome / Unknown
    validations:
      required: false
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or other details
      description: Optional. Drag screenshots or recordings here. Hide anything private before uploading.
    validations:
      required: false
