version = 1
name = "chugmania"

[setup]
script = '''
cd "$CODEX_WORKTREE_PATH"
cp -R "$CODEX_SOURCE_TREE_PATH/data" .
bun install --frozen-lockfile
PORT="$(awk 'BEGIN{srand(); printf "%d\n", 6900 + int(rand() * 100)}')"
cat > .env <<EOF
SECRET="dev"
PORT="$PORT"
EOF
'''

[cleanup]
script = "rm -rf \"$CODEX_WORKTREE_PATH\""

[[actions]]
name = "run dev"
icon = "run"
command = "bun run dev"

[[actions]]
name = "check"
icon = "test"
command = "bun run check"
